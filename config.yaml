    # 可在这里找到你的api key https://bailian.console.aliyun.com/?apiKey=1#/api-key
    api_key: 你的api_key
  XunfeiSparkLLM:
    # 定义LLM API类型
    type: openai
    # 先新建应用，在下面的地址
    # 开通应用地址：https://console.xfyun.cn/app/myapp
    # 有免费额度，但也要开通服务，才能获取api_key
    # 每一个模型都需要单独开通，每一个模型的api_password都不同，例如Lite模型在https://console.xfyun.cn/services/cbm 开通
    base_url: https://ark.cn-beijing.volces.com/api/v3
    model_name: lite
    api_key: 你的api_password
TTS:
  # 当前支持的type为edge、tencent
  EdgeTTS:
    # 定义TTS API类型
    type: edge
    voice: zh-CN-XiaoxiaoNeural
    output_dir: tmp/
    # language: "中文"  # 指定输出语种,如:中文、英语、日语、韩语等,请根据所选音色支持的语言进行设置,不填则默认为中文
  TencentTTS:
    # 腾讯云智能语音交互服务，需要先在腾讯云平台开通服务
    # appid、secret_id、secret_key申请地址：https://console.cloud.tencent.com/cam/capi
    # 免费领取资源：https://console.cloud.tencent.com/tts/resourcebundle
    type: tencent
    output_dir: tmp/
    appid: 你的腾讯云AppId
    secret_id: 你的腾讯云SecretID
    secret_key: 你的腾讯云SecretKey
    region: ap-guangzhou
    voice: 602003  # 爱小悠(超自然大模型·聊天女声·情感丰富韵律舒适)，支持24k；EdgeTTS 降为兜底
    # language: "中文"  # 指定输出语种,如:中文、英语、日语、韩语等,请根据所选音色支持的语言进行设置,不填则默认为中文
    # 以下可不用设置，使用默认设置
    # format: wav  # 音频格式：pcm、wav、mp3
    # volume: 0  # 音量：-10到10
    # speech_rate: 0  # 语速：-2到6
  # ── FlowTTS（腾讯云对话式 TTS，候选 provider，默认不启用）──
  # 超低延迟、拟人度高、支持声音克隆音色；WebSocket 双向流式协议。
  # 启用步骤：1) TRTC 控制台建应用拿 SdkAppId；2) voice 填克隆出的 VoiceId
  #   （由 voiceprint.clone_enabled 一次录音两用生成），或直接填精品音色 ID；
  #   3) selected_module.TTS 改为 FlowTTS。
  # 未填 Sdk_app_id / 不改 selected_module.TTS 时本块被忽略，不影响 EdgeTTS/TencentTTS 主路径。
  FlowTTS:
    type: flowtts
    sdk_app_id: ""          # TRTC 应用 SdkAppId（与 voiceprint.clone 共用）
    secret_id: ""           # 复用腾讯云密钥（与 ASR/说话人识别同账号）
    secret_key: ""
    voice: ""               # 克隆出的 VoiceId 或精品音色 ID（选中时必填）
    region: ap-guangzhou
    model: flow_02_turbo    # 对话场景主推模型（超低延迟、拟人度高）
    sample_rate: 24000      # 流式 raw PCM 采样率（设备协议 24k）
    format: mp3             # text_to_speak 落盘/返回格式（流式内部用 pcm）
    speed: 1.0              # 0.5–2.0
    volume: 1.0             # (0,10]
    pitch: 0.0              # -12–12
    output_dir: tmp/
# ===== 对讲（Intercom）服务端配置（覆盖项；缺省=不开服务端 AEC）=====
# 与 data/.config.yaml 同名字段语义一致，详见该文件的 intercom.server_aec 注释。
# intercom:
#   server_aec: false   # B2 全双工服务端 AEC 总开关；默认 false = B1 半双工先上。
#                       # 仅当固件团队确认设备支持「收 aec_ready 后切 2ch[mic|ref] 上行」时灰度开启。

# ===== M16 · 小程序用户鉴权（微信登录 → JWT）=====
# appid/secret：微信公众平台「开发管理-开发设置」获取（小程序专属）
# jwt_secret：请改成随机长字符串（建议 32+ 字节），生产务必与 dev_mode 一起配置
# dev_mode：true=联调用确定性 dev openid（任何人可用任意 code 登录，严禁生产开启）；
#           生产须填真实 appid/secret 并设 dev_mode: false
miniprogram:
  appid: ""   # 生产小程序 AppID（已填）
  secret: ""  # 生产小程序 AppSecret（已填）
  jwt_secret: ""
  dev_mode: false    # 生产态：关闭确定性 dev openid，强制 code2session 校验真实 appid/secret

# 地方文旅知识库（TourismKB）：泛化自 FamilyRAG 的语义检索，叠加专名/关键词混合检索，
# 并提供 query() 基于 <知识库> 上下文的 LLM 问答。数据落盘 data/tourism_kb/<kb_id>.json。
# 注意：本文件为模板；生产真实配置在 data/.config.yaml，改 TourismKB 请同步到那里。
TourismKB:
  enabled: true
  top_k: 5
  embedding:
    type: local-st          # 本地 bge-small-zh-v1.5 语义向量（离线隐私）
  hybrid:
    semantic_weight: 0.65  # 语义 0.65 / 关键词 0.35 融合
  query:
    enabled: true
    # C5 跨域过滤不靠抬阈：实测真·湖北 query 的 best_fused 最低可到 0.40（宜昌海滨浴场/恩施带娃玩
    # 等中相关 query），抬阈会误伤这些合法 RAG。故兜底阈值保持 0.40，跨域防护改由
    # _is_cross_region_query 城市感知路由门实现（query 含主要非湖北城市/地标且分数<high_conf 即兜底）。
    fallback_threshold: 0.40
    # 不填 llm 则回退 selected_module.LLM（159 生产 = OpenAILLM/deepseek-chat）。
    # 若需单独指定，必须保证 LLM 块下存在同名子块，否则会警告并降级为片段拼接。
    timeout: 15.0
  ingest:
    enabled: true
    # 同上，不填则回退 selected_module.LLM；用于「原始资料 → 结构化抽取」
    timeout: 30.0

# 活字匣角色卡绑定运营配置（/api/v1/character-binding 权限收紧，2026-10-16）。
# admin_uids = 运营白名单：owned-tier 角色绑定、他人已 claim 卡改绑、指定 serial 均仅白名单可用。
# 缺省空 = 最严（owned-tier 绑定对所有人关闭，防 mock UID 免费解锁锁定角色）。
# 真实名单只写 data/.config.yaml（gitignored），本模板保持空占位。
character_binding:
  admin_uids: []

# 复果品牌知识库（BrandKB）：离线、零外部依赖的复果自有品牌/产品/门店知识库，
# 与 TourismKB(文旅) / FamilyRAG(家庭) 解耦——不套文旅 persona、不做跨域过滤。
# - category=core 的条目每轮注入动态 system（<brand_knowledge> 块，第一档：保底常驻）；
# - 全部条目可被 search_brand_kb 工具按需检索（第二档：长尾按需查）。
# 知识条目通过 add_doc / 小程序管理页录入，内容源由运营提供（不进 git）。
# 159 生产 data/.config.yaml 已启用（enabled: true）。
BrandKB:
  enabled: true
  top_k: 3
  min_score: 0.0
  rel_gap: 0.0
  embedding:
    type: local-st          # 与 FamilyRAG 同款本地 bge-small-zh-v1.5 语义向量（离线隐私）
